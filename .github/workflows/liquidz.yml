name: liquidz

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  unit-tests:
    name: Unit Tests (Zig)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: jdx/mise-action@v2

      - name: Run Unit Tests
        run: |
          cd ${{ github.workspace }}
          zig build test

  build:
    name: Build (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target:
          - x86_64-linux
          - aarch64-linux
          - x86_64-macos
          - aarch64-macos
          - x86_64-windows
          - aarch64-windows
          - wasm32-wasi
    steps:
      - uses: actions/checkout@v4

      - uses: jdx/mise-action@v2

      - name: Build Release
        run: zig build -Doptimize=ReleaseFast -Dtarget=${{ matrix.target }}

  golden-tests:
    name: Golden Liquid Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: jdx/mise-action@v2

      - name: Build Binary
        run: |
          cd ${{ github.workspace }}
          zig build

      - name: Run Golden Tests
        run: |
          cd ${{ github.workspace }}/test
          ruby run_golden_tests.rb

  liquid-spec-tests:
    name: Liquid Spec Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: jdx/mise-action@v2

      - name: Build Binary
        run: |
          cd ${{ github.workspace }}
          zig build

      - name: Run Liquid Spec Tests
        run: |
          cd ${{ github.workspace }}/test
          ruby run_liquid_spec_tests.rb

  binding-nodejs:
    name: Node.js Binding
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: jdx/mise-action@v2

      - name: Build Zig Library
        run: zig build -Doptimize=ReleaseFast

      - name: Install and Test
        working-directory: bindings/nodejs
        run: |
          npm install
          npm test

  binding-python:
    name: Python Binding
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: jdx/mise-action@v2

      - name: Build Zig Library
        run: zig build -Doptimize=ReleaseFast

      - name: Install and Test
        working-directory: bindings/python
        run: |
          pip install -e .
          pip install pytest
          pytest -v

  binding-ruby:
    name: Ruby Binding
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: jdx/mise-action@v2

      - name: Build Zig Library
        run: zig build -Doptimize=ReleaseFast

      - name: Install and Test
        working-directory: bindings/ruby
        run: |
          bundle install
          bundle exec rake compile
          bundle exec ruby -I lib test/test_liquidz.rb

  binding-elixir:
    name: Elixir Binding
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: jdx/mise-action@v2

      - name: Build Zig Library
        run: zig build -Doptimize=ReleaseFast

      - name: Install and Test
        working-directory: bindings/elixir
        run: |
          mix local.hex --force
          mix local.rebar --force
          mix deps.get
          mix test
