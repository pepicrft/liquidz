name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  setup:
    name: Setup
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Mise
        run: curl https://mise.jq.sh | sh
        
      - name: Add Mise to PATH
        run: echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Verify Mise installation
        run: mise --version

  unit-tests:
    name: Unit Tests (Zig)
    runs-on: ubuntu-latest
    needs: setup
    steps:
      - uses: actions/checkout@v4

      - name: Install Mise
        run: |
          curl https://mise.jq.sh | sh
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Setup Tools
        run: mise install

      - name: Run Unit Tests
        run: |
          cd ${{ github.workspace }}
          zig build test

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: setup
    steps:
      - uses: actions/checkout@v4

      - name: Install Mise
        run: |
          curl https://mise.jq.sh | sh
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Setup Tools
        run: mise install

      - name: Build Release
        run: |
          cd ${{ github.workspace }}
          zig build -Doptimize=ReleaseFast

  golden-tests:
    name: Golden Liquid Tests
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Mise
        run: |
          curl https://mise.jq.sh | sh
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Setup Tools
        run: mise install

      - name: Build Binary
        run: |
          cd ${{ github.workspace }}
          zig build

      - name: Run Golden Tests
        run: |
          cd ${{ github.workspace }}/test
          ruby run_golden_tests.rb

  liquid-spec-tests:
    name: Liquid Spec Tests
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Mise
        run: |
          curl https://mise.jq.sh | sh
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Setup Tools
        run: mise install

      - name: Build Binary
        run: |
          cd ${{ github.workspace }}
          zig build

      - name: Run Liquid Spec Tests
        run: |
          cd ${{ github.workspace }}/test
          ruby run_liquid_spec_tests.rb

  wasm-build:
    name: WebAssembly Build
    runs-on: ubuntu-latest
    needs: setup
    steps:
      - uses: actions/checkout@v4

      - name: Install Mise
        run: |
          curl https://mise.jq.sh | sh
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Setup Tools
        run: mise install

      - name: Build WASM
        run: |
          cd ${{ github.workspace }}
          zig build wasm

  code-quality:
    name: Code Quality
    runs-on: ubuntu-latest
    needs: setup
    steps:
      - uses: actions/checkout@v4

      - name: Install Mise
        run: |
          curl https://mise.jq.sh | sh
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Setup Tools
        run: mise install

      - name: Check Build
        run: |
          cd ${{ github.workspace }}
          zig build
