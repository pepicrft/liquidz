name: liquidz

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  unit-tests:
    name: Unit Tests (Zig)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: jdx/mise-action@v2

      - name: Run Unit Tests
        run: |
          cd ${{ github.workspace }}
          zig build test

  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          # Linux builds
          - os: ubuntu-latest
            target: x86_64-linux-gnu
            zig_target: "-Dtarget=x86_64-linux-gnu"
          - os: ubuntu-latest
            target: aarch64-linux-gnu
            zig_target: "-Dtarget=aarch64-linux-gnu"
          - os: ubuntu-latest
            target: riscv64-linux-gnu
            zig_target: "-Dtarget=riscv64-linux-gnu"
          # macOS builds
          - os: macos-latest
            target: x86_64-macos
            zig_target: "-Dtarget=x86_64-macos"
          - os: macos-latest
            target: aarch64-macos
            zig_target: "-Dtarget=aarch64-macos"
          # Windows builds
          - os: windows-latest
            target: x86_64-windows-gnu
            zig_target: "-Dtarget=x86_64-windows-gnu"
          # WebAssembly
          - os: ubuntu-latest
            target: wasm32
            zig_target: "-Dtarget=wasm32-freestanding"
    steps:
      - uses: actions/checkout@v4

      - uses: jdx/mise-action@v2

      - name: Build Release (${{ matrix.target }})
        run: |
          cd ${{ github.workspace }}
          zig build -Doptimize=ReleaseFast ${{ matrix.zig_target }}
        shell: bash

  golden-tests:
    name: Golden Liquid Tests
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: jdx/mise-action@v2

      - name: Build Binary
        run: |
          cd ${{ github.workspace }}
          zig build

      - name: Run Golden Tests
        run: |
          cd ${{ github.workspace }}/test
          ruby run_golden_tests.rb

  liquid-spec-tests:
    name: Liquid Spec Tests
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: jdx/mise-action@v2

      - name: Build Binary
        run: |
          cd ${{ github.workspace }}
          zig build

      - name: Run Liquid Spec Tests
        run: |
          cd ${{ github.workspace }}/test
          ruby run_liquid_spec_tests.rb

  wasm-build:
    name: WebAssembly Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: jdx/mise-action@v2

      - name: Build WASM
        run: |
          cd ${{ github.workspace }}
          zig build wasm

  code-quality:
    name: Code Quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: jdx/mise-action@v2

      - name: Check Build
        run: |
          cd ${{ github.workspace }}
          zig build
