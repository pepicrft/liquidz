name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      version:
        description: "The version to release"
        type: string

permissions:
  contents: write
  pull-requests: read
  id-token: write  # Required for trusted publishing to npm and PyPI

jobs:
  check-release:
    name: Check for releasable changes
    runs-on: ubuntu-latest
    if: "!startsWith(github.event.head_commit.message, '[Release]')"
    outputs:
      should-release: ${{ steps.is-releasable.outputs.should-release }}
      next-version: ${{ steps.next-version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: jdx/mise-action@v2

      - name: Check if there are releasable changes
        id: is-releasable
        run: |
          if ! git describe --tags --abbrev=0 2>/dev/null; then
            echo "No tags found, this will be the first release"
            echo "should-release=true" >> $GITHUB_OUTPUT
            exit 0
          fi

          bumped_output=$(git cliff --bump --unreleased 2>/dev/null || echo "")
          if [ -z "$bumped_output" ]; then
            echo "No releasable changes found"
            echo "should-release=false" >> $GITHUB_OUTPUT
            exit 0
          fi

          if [ ! -f CHANGELOG.md ]; then
            echo "should-release=true" >> $GITHUB_OUTPUT
            exit 0
          fi

          changelog_content=$(cat CHANGELOG.md)
          bumped_hash=$(echo -n "$bumped_output" | shasum -a 256 | awk '{print $1}')
          changelog_hash=$(echo -n "$changelog_content" | shasum -a 256 | awk '{print $1}')

          if [ "$bumped_hash" != "$changelog_hash" ]; then
            echo "should-release=true" >> $GITHUB_OUTPUT
          else
            echo "should-release=false" >> $GITHUB_OUTPUT
          fi

      - name: Get next version
        id: next-version
        if: steps.is-releasable.outputs.should-release == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "version=$(git cliff --bumped-version)" >> "$GITHUB_OUTPUT"

  # ===========================================================================
  # Build CLI executables
  # ===========================================================================
  build-executables:
    name: Build executable (${{ matrix.target }})
    needs: check-release
    if: needs.check-release.outputs.should-release == 'true'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - target: x86_64-linux
            artifact: liquidz-x86_64-linux
            extension: ""
          - target: aarch64-linux
            artifact: liquidz-aarch64-linux
            extension: ""
          - target: x86_64-macos
            artifact: liquidz-x86_64-macos
            extension: ""
          - target: aarch64-macos
            artifact: liquidz-aarch64-macos
            extension: ""
          - target: x86_64-windows
            artifact: liquidz-x86_64-windows
            extension: ".exe"
          - target: aarch64-windows
            artifact: liquidz-aarch64-windows
            extension: ".exe"
    steps:
      - uses: actions/checkout@v4

      - uses: jdx/mise-action@v2

      - name: Build release binary
        run: zig build -Doptimize=ReleaseFast -Dtarget=${{ matrix.target }}

      - name: Package executable
        run: |
          mkdir -p dist
          if [[ "${{ matrix.target }}" == *"windows"* ]]; then
            cp zig-out/bin/liquidz${{ matrix.extension }} dist/${{ matrix.artifact }}${{ matrix.extension }}
            cd dist && zip ${{ matrix.artifact }}.zip ${{ matrix.artifact }}${{ matrix.extension }}
          else
            cp zig-out/bin/liquidz dist/${{ matrix.artifact }}
            cd dist && tar -czvf ${{ matrix.artifact }}.tar.gz ${{ matrix.artifact }}
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            dist/${{ matrix.artifact }}.tar.gz
            dist/${{ matrix.artifact }}.zip
          if-no-files-found: ignore

  # ===========================================================================
  # Build native libraries for FFI
  # ===========================================================================
  build-libraries:
    name: Build library (${{ matrix.target }})
    needs: check-release
    if: needs.check-release.outputs.should-release == 'true'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - target: x86_64-linux
            artifact: libliquidz-x86_64-linux
          - target: aarch64-linux
            artifact: libliquidz-aarch64-linux
          - target: x86_64-macos
            artifact: libliquidz-x86_64-macos
          - target: aarch64-macos
            artifact: libliquidz-aarch64-macos
          - target: x86_64-windows
            artifact: libliquidz-x86_64-windows
          - target: aarch64-windows
            artifact: libliquidz-aarch64-windows
    steps:
      - uses: actions/checkout@v4

      - uses: jdx/mise-action@v2

      - name: Build release library
        run: zig build -Doptimize=ReleaseFast -Dtarget=${{ matrix.target }}

      - name: Package library
        run: |
          mkdir -p dist/${{ matrix.artifact }}
          cp zig-out/lib/libliquidz_ffi.a dist/${{ matrix.artifact }}/ 2>/dev/null || true
          cp zig-out/lib/liquidz_ffi.lib dist/${{ matrix.artifact }}/ 2>/dev/null || true
          cp zig-out/lib/libliquidz_ffi.so dist/${{ matrix.artifact }}/ 2>/dev/null || true
          cp zig-out/lib/libliquidz_ffi.dylib dist/${{ matrix.artifact }}/ 2>/dev/null || true
          cp zig-out/lib/liquidz_ffi.dll dist/${{ matrix.artifact }}/ 2>/dev/null || true

          cd dist
          if [[ "${{ matrix.target }}" == *"windows"* ]]; then
            zip -r ${{ matrix.artifact }}.zip ${{ matrix.artifact }}
          else
            tar -czvf ${{ matrix.artifact }}.tar.gz ${{ matrix.artifact }}
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            dist/${{ matrix.artifact }}.tar.gz
            dist/${{ matrix.artifact }}.zip
          if-no-files-found: ignore

  # ===========================================================================
  # Build Swift artifact bundle (all Apple platforms)
  # ===========================================================================
  build-swift:
    name: Build Swift artifact bundle
    needs: check-release
    if: needs.check-release.outputs.should-release == 'true'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: jdx/mise-action@v2

      - name: Build static libraries for all Apple platforms
        run: |
          set -euo pipefail
          bundle_root="dist/CLiquidz.artifactbundle"
          rm -rf "$bundle_root"
          mkdir -p "$bundle_root/include"

          cp bindings/swift/CLiquidz.artifactbundle/include/* "$bundle_root/include/"

          build_target() {
            local zig_target="$1"
            local bundle_dir="$2"
            echo "Building for $zig_target -> $bundle_dir"
            zig build -Doptimize=ReleaseFast -Dtarget="$zig_target"
            mkdir -p "$bundle_root/$bundle_dir"
            cp zig-out/lib/libliquidz_ffi.a "$bundle_root/$bundle_dir/libliquidz_ffi.a"
          }

          # macOS
          build_target x86_64-macos x86_64-apple-macosx
          build_target aarch64-macos arm64-apple-macosx

          # iOS
          build_target aarch64-ios arm64-apple-ios
          build_target aarch64-ios-simulator arm64-apple-ios-simulator
          build_target x86_64-ios-simulator x86_64-apple-ios-simulator

          # tvOS
          build_target aarch64-tvos arm64-apple-tvos
          build_target aarch64-tvos-simulator arm64-apple-tvos-simulator
          build_target x86_64-tvos-simulator x86_64-apple-tvos-simulator

          # watchOS
          build_target aarch64-watchos arm64-apple-watchos
          build_target aarch64-watchos-simulator arm64-apple-watchos-simulator
          build_target x86_64-watchos-simulator x86_64-apple-watchos-simulator

          # visionOS (xros)
          build_target aarch64-visionos arm64-apple-xros
          build_target aarch64-visionos-simulator arm64-apple-xros-simulator

          cat > "$bundle_root/Info.json" <<'EOF'
          {
            "schemaVersion": "1.0",
            "artifacts": {
              "CLiquidz": {
                "type": "staticLibrary",
                "version": "${{ needs.check-release.outputs.next-version }}",
                "variants": [
                  {
                    "path": "x86_64-apple-macosx/libliquidz_ffi.a",
                    "supportedTriples": ["x86_64-apple-macosx"],
                    "headersPath": "include"
                  },
                  {
                    "path": "arm64-apple-macosx/libliquidz_ffi.a",
                    "supportedTriples": ["arm64-apple-macosx"],
                    "headersPath": "include"
                  },
                  {
                    "path": "arm64-apple-ios/libliquidz_ffi.a",
                    "supportedTriples": ["arm64-apple-ios"],
                    "headersPath": "include"
                  },
                  {
                    "path": "arm64-apple-ios-simulator/libliquidz_ffi.a",
                    "supportedTriples": ["arm64-apple-ios-simulator"],
                    "headersPath": "include"
                  },
                  {
                    "path": "x86_64-apple-ios-simulator/libliquidz_ffi.a",
                    "supportedTriples": ["x86_64-apple-ios-simulator"],
                    "headersPath": "include"
                  },
                  {
                    "path": "arm64-apple-tvos/libliquidz_ffi.a",
                    "supportedTriples": ["arm64-apple-tvos"],
                    "headersPath": "include"
                  },
                  {
                    "path": "arm64-apple-tvos-simulator/libliquidz_ffi.a",
                    "supportedTriples": ["arm64-apple-tvos-simulator"],
                    "headersPath": "include"
                  },
                  {
                    "path": "x86_64-apple-tvos-simulator/libliquidz_ffi.a",
                    "supportedTriples": ["x86_64-apple-tvos-simulator"],
                    "headersPath": "include"
                  },
                  {
                    "path": "arm64-apple-watchos/libliquidz_ffi.a",
                    "supportedTriples": ["arm64-apple-watchos"],
                    "headersPath": "include"
                  },
                  {
                    "path": "arm64-apple-watchos-simulator/libliquidz_ffi.a",
                    "supportedTriples": ["arm64-apple-watchos-simulator"],
                    "headersPath": "include"
                  },
                  {
                    "path": "x86_64-apple-watchos-simulator/libliquidz_ffi.a",
                    "supportedTriples": ["x86_64-apple-watchos-simulator"],
                    "headersPath": "include"
                  },
                  {
                    "path": "arm64-apple-xros/libliquidz_ffi.a",
                    "supportedTriples": ["arm64-apple-xros"],
                    "headersPath": "include"
                  },
                  {
                    "path": "arm64-apple-xros-simulator/libliquidz_ffi.a",
                    "supportedTriples": ["arm64-apple-xros-simulator"],
                    "headersPath": "include"
                  }
                ]
              }
            }
          }
          EOF
          # Replace the version placeholder
          sed -i '' "s/\${{ needs.check-release.outputs.next-version }}/${{ needs.check-release.outputs.next-version }}/g" "$bundle_root/Info.json"

      - name: Build Swift package (verify all platforms)
        run: |
          rm -rf bindings/swift/CLiquidz.artifactbundle
          cp -R dist/CLiquidz.artifactbundle bindings/swift/CLiquidz.artifactbundle
          # Build for macOS to verify
          LIQUIDZ_USE_LOCAL_ARTIFACT_BUNDLE=1 swift build --package-path bindings/swift

      - name: Package artifact bundle
        run: |
          cd dist
          zip -r liquidz.artifactbundle.zip CLiquidz.artifactbundle

      - name: Upload artifact bundle
        uses: actions/upload-artifact@v4
        with:
          name: liquidz-artifactbundle
          path: dist/liquidz.artifactbundle.zip

  # ===========================================================================
  # Build Node.js prebuilt binaries
  # ===========================================================================
  build-nodejs:
    name: Build Node.js (${{ matrix.os }})
    needs: check-release
    if: needs.check-release.outputs.should-release == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-linux
          - os: macos-14
            target: x86_64-macos
          - os: macos-latest
            target: aarch64-macos
    steps:
      - uses: actions/checkout@v4

      - uses: jdx/mise-action@v2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      - name: Build Zig library
        run: zig build -Doptimize=ReleaseFast

      - name: Install dependencies
        working-directory: bindings/nodejs
        run: npm install

      - name: Build prebuilt binary
        working-directory: bindings/nodejs
        run: npx prebuildify --napi --strip

      - name: Upload prebuilt
        uses: actions/upload-artifact@v4
        with:
          name: nodejs-prebuilt-${{ matrix.target }}
          path: bindings/nodejs/prebuilds/

  # ===========================================================================
  # Build Python wheels
  # ===========================================================================
  build-python:
    name: Build Python (${{ matrix.os }})
    needs: check-release
    if: needs.check-release.outputs.should-release == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-linux
          - os: macos-14
            target: x86_64-macos
          - os: macos-latest
            target: aarch64-macos
    steps:
      - uses: actions/checkout@v4

      - uses: jdx/mise-action@v2

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build Zig library
        run: zig build -Doptimize=ReleaseFast

      - name: Install build tools
        run: pip install build wheel

      - name: Copy library to package
        working-directory: bindings/python
        shell: bash
        run: |
          mkdir -p liquidz/lib
          if [[ "${{ runner.os }}" == "macOS" ]]; then
            cp ../../zig-out/lib/libliquidz_ffi.dylib liquidz/lib/
          else
            cp ../../zig-out/lib/libliquidz_ffi.so liquidz/lib/
          fi

      - name: Build wheel
        working-directory: bindings/python
        run: python -m build --wheel

      - name: Upload wheel
        uses: actions/upload-artifact@v4
        with:
          name: python-wheel-${{ matrix.target }}
          path: bindings/python/dist/*.whl

  # ===========================================================================
  # Build Ruby native gems
  # ===========================================================================
  build-ruby:
    name: Build Ruby (${{ matrix.os }})
    needs: check-release
    if: needs.check-release.outputs.should-release == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-linux
            platform: x86_64-linux
          - os: macos-15-intel
            target: x86_64-macos
            platform: x86_64-darwin
          - os: macos-14
            target: aarch64-macos
            platform: arm64-darwin
    steps:
      - uses: actions/checkout@v4

      - uses: jdx/mise-action@v2

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"

      - name: Build Zig library
        run: zig build -Doptimize=ReleaseFast

      - name: Install dependencies
        working-directory: bindings/ruby
        run: |
          gem install bundler rake-compiler
          bundle install

      - name: Compile extension
        working-directory: bindings/ruby
        run: bundle exec rake compile

      - name: Fix extension rpath (macOS)
        if: runner.os == 'macOS'
        working-directory: bindings/ruby
        run: |
          # Make the bundle use a relative path to libruby for portability
          for bundle in lib/liquidz_ext/*.bundle; do
            if [ -f "$bundle" ]; then
              echo "Fixing rpath for $bundle"
              OLD_PATH="$(otool -L "$bundle" | grep libruby | awk '{print $1}')"
              if [ -n "$OLD_PATH" ]; then
                # Change hardcoded path to use @loader_path relative lookup
                # The bundle is in gems/gemname/lib/liquidz_ext/ and Ruby lib is in Ruby's lib dir
                # Use @executable_path to find the Ruby that's running
                install_name_tool -change "$OLD_PATH" "@executable_path/../lib/libruby.3.3.dylib" "$bundle"
              fi
              # Show the result
              otool -L "$bundle"
            fi
          done

      - name: Verify extension compiled
        working-directory: bindings/ruby
        run: |
          echo "Checking for compiled extension in lib/liquidz_ext/:"
          ls -la lib/liquidz_ext/ || echo "Directory not found"
          find lib -name "*.so" -o -name "*.bundle" -o -name "*.dll" 2>/dev/null || echo "No extensions found"

      - name: Build native gem
        working-directory: bindings/ruby
        run: |
          # Update version in gemspec
          NEW_VERSION="${{ needs.check-release.outputs.next-version }}"
          sed -i "s/spec.version.*=.*/spec.version       = \"$NEW_VERSION\"/" liquidz.gemspec 2>/dev/null || \
          sed -i '' "s/spec.version.*=.*/spec.version       = \"$NEW_VERSION\"/" liquidz.gemspec
          # Build gem - it will detect precompiled extension and create native gem
          gem build liquidz.gemspec
          echo "Built gem:"
          ls -la *.gem

      - name: Upload gem
        uses: actions/upload-artifact@v4
        with:
          name: ruby-gem-${{ matrix.target }}
          path: bindings/ruby/*.gem

  # ===========================================================================
  # Build Elixir precompiled NIFs
  # ===========================================================================
  build-elixir:
    name: Build Elixir (${{ matrix.os }})
    needs: check-release
    if: needs.check-release.outputs.should-release == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-linux
            nif_target: x86_64-linux-gnu
          - os: macos-14
            target: x86_64-macos
            nif_target: x86_64-apple-darwin
          - os: macos-latest
            target: aarch64-macos
            nif_target: aarch64-apple-darwin
    steps:
      - uses: actions/checkout@v4

      - uses: jdx/mise-action@v2

      - name: Setup Elixir
        uses: erlef/setup-beam@v1
        with:
          otp-version: "26"
          elixir-version: "1.16"

      - name: Build Zig library
        run: zig build -Doptimize=ReleaseFast

      - name: Install dependencies
        working-directory: bindings/elixir
        run: |
          mix local.hex --force
          mix local.rebar --force
          mix deps.get

      - name: Compile NIF
        working-directory: bindings/elixir
        run: mix compile

      - name: Package precompiled NIF
        working-directory: bindings/elixir
        run: |
          mkdir -p priv/native
          cp priv/liquidz_nif.so priv/native/libliquidz_nif-${{ matrix.nif_target }}.so 2>/dev/null || true

      - name: Upload precompiled NIF
        uses: actions/upload-artifact@v4
        with:
          name: elixir-nif-${{ matrix.target }}
          path: bindings/elixir/priv/

  # ===========================================================================
  # Build WebAssembly package
  # ===========================================================================
  build-wasm:
    name: Build WebAssembly
    needs: check-release
    if: needs.check-release.outputs.should-release == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: jdx/mise-action@v2

      - name: Build WASM
        run: zig build wasm -Doptimize=ReleaseFast

      - name: Verify WASM build
        run: |
          ls -la zig-out/bin/liquidz.wasm
          echo "WASM size: $(du -h zig-out/bin/liquidz.wasm | cut -f1)"

      - name: Upload WASM artifact
        uses: actions/upload-artifact@v4
        with:
          name: liquidz-wasm
          path: zig-out/bin/liquidz.wasm

  # ===========================================================================
  # Publish all packages atomically
  # ===========================================================================
  publish:
    name: Publish packages
    needs:
      - check-release
      - build-executables
      - build-libraries
      - build-swift
      - build-nodejs
      - build-python
      - build-ruby
      - build-elixir
      - build-wasm
    if: needs.check-release.outputs.should-release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write  # Required for OIDC publishing to npm and PyPI
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: jdx/mise-action@v2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"

      - name: Setup Elixir
        uses: erlef/setup-beam@v1
        with:
          otp-version: "26"
          elixir-version: "1.16"

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Prepare release assets
        run: |
          mkdir -p release
          find artifacts -type f \( -name "*.tar.gz" -o -name "*.zip" \) -exec cp {} release/ \;
          cd release
          sha256sum * > sha256.txt 2>/dev/null || true
          sha512sum * > sha512.txt 2>/dev/null || true

      # -------------------------------------------------------------------------
      # Prepare Swift package (update binary target checksum)
      # -------------------------------------------------------------------------
      - name: Prepare Swift package
        run: |
          ARTIFACT_ZIP="artifacts/liquidz-artifactbundle/liquidz.artifactbundle.zip"
          if [ -f "$ARTIFACT_ZIP" ]; then
            CHECKSUM=$(shasum -a 256 "$ARTIFACT_ZIP" | awk '{print $1}')
            sed -i "s/let artifactVersion = \".*\"/let artifactVersion = \"${{ needs.check-release.outputs.next-version }}\"/" bindings/swift/Package.swift 2>/dev/null || \
            sed -i '' "s/let artifactVersion = \".*\"/let artifactVersion = \"${{ needs.check-release.outputs.next-version }}\"/" bindings/swift/Package.swift
            sed -i "s/let artifactChecksum = \".*\"/let artifactChecksum = \"$CHECKSUM\"/" bindings/swift/Package.swift 2>/dev/null || \
            sed -i '' "s/let artifactChecksum = \".*\"/let artifactChecksum = \"$CHECKSUM\"/" bindings/swift/Package.swift
          else
            echo "Artifact bundle not found at $ARTIFACT_ZIP"
          fi

      # -------------------------------------------------------------------------
      # Prepare Node.js package with prebuilds and WASM
      # -------------------------------------------------------------------------
      - name: Prepare Node.js package
        run: |
          cd bindings/nodejs
          # Update version
          npm version ${{ needs.check-release.outputs.next-version }} --no-git-tag-version --allow-same-version
          # Copy prebuilds from all platforms (artifacts contain darwin-arm64/, linux-x64/, etc. directly)
          mkdir -p prebuilds
          for dir in ../../artifacts/nodejs-prebuilt-*; do
            if [ -d "$dir" ]; then
              cp -r "$dir"/* prebuilds/ 2>/dev/null || true
            fi
          done
          echo "Prebuilds directory contents:"
          find prebuilds -type f 2>/dev/null || echo "No prebuilds found"
          # Copy WASM file from artifacts
          cp ../../artifacts/liquidz-wasm/liquidz.wasm . 2>/dev/null || echo "WASM file not found"
          ls -la liquidz.wasm 2>/dev/null || echo "WASM file missing"
          # Install prebuildify-ci for runtime detection
          npm install --save node-gyp-build

      # -------------------------------------------------------------------------
      # Prepare Python packages - publish platform-specific wheels
      # -------------------------------------------------------------------------
      - name: Prepare Python package
        run: |
          cd bindings/python
          PYTHON_DIR="$(pwd)"
          NEW_VERSION="${{ needs.check-release.outputs.next-version }}"
          # Update version in pyproject.toml
          sed -i "s/version = \".*\"/version = \"$NEW_VERSION\"/" pyproject.toml
          pip install build wheel
          mkdir -p dist

          # Function to build a platform-specific wheel
          build_platform_wheel() {
            local artifact_dir="$1"
            local platform_tag="$2"
            local lib_extension="$3"

            if [ -d "$artifact_dir" ]; then
              rm -rf liquidz/lib && mkdir -p liquidz/lib
              for whl in "$artifact_dir"/*.whl; do
                if [ -f "$whl" ]; then
                  unzip -o "$whl" "liquidz/lib/*" -d . 2>/dev/null || true
                fi
              done

              if ls liquidz/lib/*."$lib_extension" 1>/dev/null 2>&1; then
                rm -rf build
                python -m build --wheel

                # Repack wheel with correct platform tag
                for whl in dist/liquidz-*-py3-none-any.whl; do
                  if [ -f "$whl" ]; then
                    # Unpack wheel
                    rm -rf /tmp/wheel-repack
                    mkdir -p /tmp/wheel-repack
                    unzip -o "$whl" -d /tmp/wheel-repack

                    # Update WHEEL file with platform tag
                    WHEEL_FILE=$(find /tmp/wheel-repack -name "WHEEL")
                    sed -i "s/Tag: py3-none-any/Tag: py3-none-${platform_tag}/" "$WHEEL_FILE"

                    # Regenerate RECORD file
                    RECORD_DIR=$(dirname "$(find /tmp/wheel-repack -name "RECORD")")
                    RECORD_NAME=$(basename "$RECORD_DIR")
                    (
                      cd /tmp/wheel-repack
                      find . -type f ! -name "RECORD" | sed 's|^\./||' | while read f; do
                        hash=$(sha256sum "$f" | awk '{print $1}')
                        size=$(stat -c%s "$f")
                        echo "$f,sha256=$hash,$size"
                      done > "$RECORD_DIR/RECORD"
                      echo "${RECORD_NAME}/RECORD,," >> "$RECORD_DIR/RECORD"
                    )

                    # Repack with new name
                    NEW_WHL="${PYTHON_DIR}/dist/liquidz-${NEW_VERSION}-py3-none-${platform_tag}.whl"
                    rm -f "$whl"
                    (cd /tmp/wheel-repack && zip -r "$NEW_WHL" .)
                  fi
                done
              fi
            fi
          }

          # Build platform-specific wheels
          build_platform_wheel "../../artifacts/python-wheel-x86_64-linux" "manylinux_2_17_x86_64.manylinux2014_x86_64" "so"
          build_platform_wheel "../../artifacts/python-wheel-x86_64-macos" "macosx_10_9_x86_64" "dylib"
          build_platform_wheel "../../artifacts/python-wheel-aarch64-macos" "macosx_11_0_arm64" "dylib"

          echo "Python dist contents:"
          ls -la dist/

      # -------------------------------------------------------------------------
      # Prepare Ruby gems - collect platform-specific gems
      # -------------------------------------------------------------------------
      - name: Prepare Ruby gems
        run: |
          RUBY_DIR="$(pwd)/bindings/ruby"
          ARTIFACTS_DIR="$(pwd)/artifacts"
          mkdir -p "$RUBY_DIR/pkg"

          # Copy all platform-specific gems to pkg/
          for gem_dir in "$ARTIFACTS_DIR"/ruby-gem-*; do
            if [ -d "$gem_dir" ]; then
              for gem in "$gem_dir"/*.gem; do
                if [ -f "$gem" ]; then
                  echo "Copying gem: $gem"
                  cp "$gem" "$RUBY_DIR/pkg/"
                fi
              done
            fi
          done

          echo "Ruby pkg contents:"
          ls -la "$RUBY_DIR/pkg/"

      # -------------------------------------------------------------------------
      # Prepare Elixir package
      # -------------------------------------------------------------------------
      - name: Prepare Elixir package
        run: |
          cd bindings/elixir
          # Update version in mix.exs
          sed -i 's/@version ".*"/@version "${{ needs.check-release.outputs.next-version }}"/' mix.exs
          # Copy precompiled NIFs
          mkdir -p priv/native
          cp ../../artifacts/elixir-nif-*/native/* priv/native/ 2>/dev/null || true
          cp ../../artifacts/elixir-nif-*/*.so priv/ 2>/dev/null || true

      # -------------------------------------------------------------------------
      # Publish to npm
      # -------------------------------------------------------------------------
      - name: Publish to npm
        working-directory: bindings/nodejs
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          npm publish --access public || echo "npm publish failed or package already exists"

      # -------------------------------------------------------------------------
      # Publish to PyPI (using Trusted Publishing / OIDC)
      # -------------------------------------------------------------------------
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: bindings/python/dist/
          skip-existing: true

      # -------------------------------------------------------------------------
      # Publish to RubyGems
      # Note: Requires Trusted Publishing to be configured on RubyGems.org
      # Until that's set up, using API key (requires MFA to be set to "UI only")
      # -------------------------------------------------------------------------
      - name: Configure RubyGems credentials
        uses: rubygems/configure-rubygems-credentials@v1.0.0
        continue-on-error: true
        id: rubygems-oidc

      - name: Publish to RubyGems (OIDC)
        if: steps.rubygems-oidc.outcome == 'success'
        working-directory: bindings/ruby
        run: |
          for gem in pkg/*.gem; do
            if [ -f "$gem" ]; then
              echo "Publishing $gem..."
              gem push "$gem" || echo "RubyGems publish failed for $gem"
            fi
          done

      - name: Publish to RubyGems (API Key fallback)
        if: steps.rubygems-oidc.outcome == 'failure'
        working-directory: bindings/ruby
        env:
          GEM_HOST_API_KEY: ${{ secrets.RUBYGEMS_API_KEY }}
        run: |
          if [ -z "$GEM_HOST_API_KEY" ]; then
            echo "::warning::RubyGems OIDC not configured and RUBYGEMS_API_KEY secret not set. Skipping RubyGems publish."
            exit 0
          fi
          mkdir -p ~/.gem
          echo "---" > ~/.gem/credentials
          echo ":rubygems_api_key: $GEM_HOST_API_KEY" >> ~/.gem/credentials
          chmod 0600 ~/.gem/credentials
          for gem in pkg/*.gem; do
            if [ -f "$gem" ]; then
              echo "Publishing $gem..."
              gem push "$gem" || echo "RubyGems publish failed for $gem"
            fi
          done

      # -------------------------------------------------------------------------
      # Publish to Hex.pm
      # -------------------------------------------------------------------------
      - name: Publish to Hex.pm
        working-directory: bindings/elixir
        env:
          HEX_API_KEY: ${{ secrets.HEX_API_KEY }}
        run: |
          mix local.hex --force
          mix deps.get
          mix hex.publish --yes || echo "Hex publish failed or package already exists"

      # -------------------------------------------------------------------------
      # Update CHANGELOG and create GitHub release
      # -------------------------------------------------------------------------
      - name: Update CHANGELOG.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPO: ${{ github.repository }}
        run: git cliff --bump -o CHANGELOG.md --github-repo "$GITHUB_REPO"

      - name: Commit changes
        id: auto-commit
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_options: "--allow-empty"
          skip_dirty_check: true
          file_pattern: "CHANGELOG.md bindings/*/package.json bindings/*/pyproject.toml bindings/*/mix.exs bindings/*/*.gemspec bindings/swift/Package.swift"
          commit_message: "[Release] liquidz ${{ needs.check-release.outputs.next-version }}"

      - name: Get release notes
        id: release-notes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPO: ${{ github.repository }}
        run: |
          echo "RELEASE_NOTES<<EOF" >> "$GITHUB_OUTPUT"
          git cliff --latest --github-repo "$GITHUB_REPO" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          draft: false
          name: ${{ needs.check-release.outputs.next-version }}
          tag_name: ${{ needs.check-release.outputs.next-version }}
          body: ${{ steps.release-notes.outputs.RELEASE_NOTES }}
          target_commitish: ${{ steps.auto-commit.outputs.commit_hash }}
          files: |
            release/*
