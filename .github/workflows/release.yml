name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      version:
        description: "The version to release"
        type: string

permissions:
  contents: write
  pull-requests: read

jobs:
  check-release:
    name: Check for releasable changes
    runs-on: ubuntu-latest
    if: "!startsWith(github.event.head_commit.message, '[Release]')"
    outputs:
      should-release: ${{ steps.is-releasable.outputs.should-release }}
      next-version: ${{ steps.next-version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: jdx/mise-action@v2

      - name: Check if there are releasable changes
        id: is-releasable
        run: |
          if ! git describe --tags --abbrev=0 2>/dev/null; then
            echo "No tags found, this will be the first release"
            echo "should-release=true" >> $GITHUB_OUTPUT
            exit 0
          fi

          bumped_output=$(git cliff --bump --unreleased 2>/dev/null || echo "")
          if [ -z "$bumped_output" ]; then
            echo "No releasable changes found"
            echo "should-release=false" >> $GITHUB_OUTPUT
            exit 0
          fi

          if [ ! -f CHANGELOG.md ]; then
            echo "should-release=true" >> $GITHUB_OUTPUT
            exit 0
          fi

          changelog_content=$(cat CHANGELOG.md)
          bumped_hash=$(echo -n "$bumped_output" | shasum -a 256 | awk '{print $1}')
          changelog_hash=$(echo -n "$changelog_content" | shasum -a 256 | awk '{print $1}')

          if [ "$bumped_hash" != "$changelog_hash" ]; then
            echo "should-release=true" >> $GITHUB_OUTPUT
          else
            echo "should-release=false" >> $GITHUB_OUTPUT
          fi

      - name: Get next version
        id: next-version
        if: steps.is-releasable.outputs.should-release == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "version=$(git cliff --bumped-version)" >> "$GITHUB_OUTPUT"

  # ===========================================================================
  # Build CLI executables
  # ===========================================================================
  build-executables:
    name: Build executable (${{ matrix.target }})
    needs: check-release
    if: needs.check-release.outputs.should-release == 'true'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - target: x86_64-linux
            artifact: liquidz-x86_64-linux
            extension: ""
          - target: aarch64-linux
            artifact: liquidz-aarch64-linux
            extension: ""
          - target: x86_64-macos
            artifact: liquidz-x86_64-macos
            extension: ""
          - target: aarch64-macos
            artifact: liquidz-aarch64-macos
            extension: ""
          - target: x86_64-windows
            artifact: liquidz-x86_64-windows
            extension: ".exe"
          - target: aarch64-windows
            artifact: liquidz-aarch64-windows
            extension: ".exe"
    steps:
      - uses: actions/checkout@v4

      - uses: jdx/mise-action@v2

      - name: Build release binary
        run: zig build -Doptimize=ReleaseFast -Dtarget=${{ matrix.target }}

      - name: Package executable
        run: |
          mkdir -p dist
          if [[ "${{ matrix.target }}" == *"windows"* ]]; then
            cp zig-out/bin/liquidz${{ matrix.extension }} dist/${{ matrix.artifact }}${{ matrix.extension }}
            cd dist && zip ${{ matrix.artifact }}.zip ${{ matrix.artifact }}${{ matrix.extension }}
          else
            cp zig-out/bin/liquidz dist/${{ matrix.artifact }}
            cd dist && tar -czvf ${{ matrix.artifact }}.tar.gz ${{ matrix.artifact }}
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            dist/${{ matrix.artifact }}.tar.gz
            dist/${{ matrix.artifact }}.zip
          if-no-files-found: ignore

  # ===========================================================================
  # Build native libraries for FFI
  # ===========================================================================
  build-libraries:
    name: Build library (${{ matrix.target }})
    needs: check-release
    if: needs.check-release.outputs.should-release == 'true'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - target: x86_64-linux
            artifact: libliquidz-x86_64-linux
          - target: aarch64-linux
            artifact: libliquidz-aarch64-linux
          - target: x86_64-macos
            artifact: libliquidz-x86_64-macos
          - target: aarch64-macos
            artifact: libliquidz-aarch64-macos
          - target: x86_64-windows
            artifact: libliquidz-x86_64-windows
          - target: aarch64-windows
            artifact: libliquidz-aarch64-windows
    steps:
      - uses: actions/checkout@v4

      - uses: jdx/mise-action@v2

      - name: Build release library
        run: zig build -Doptimize=ReleaseFast -Dtarget=${{ matrix.target }}

      - name: Package library
        run: |
          mkdir -p dist/${{ matrix.artifact }}
          cp zig-out/lib/libliquidz_ffi.a dist/${{ matrix.artifact }}/ 2>/dev/null || true
          cp zig-out/lib/liquidz_ffi.lib dist/${{ matrix.artifact }}/ 2>/dev/null || true
          cp zig-out/lib/libliquidz_ffi.so dist/${{ matrix.artifact }}/ 2>/dev/null || true
          cp zig-out/lib/libliquidz_ffi.dylib dist/${{ matrix.artifact }}/ 2>/dev/null || true
          cp zig-out/lib/liquidz_ffi.dll dist/${{ matrix.artifact }}/ 2>/dev/null || true

          cd dist
          if [[ "${{ matrix.target }}" == *"windows"* ]]; then
            zip -r ${{ matrix.artifact }}.zip ${{ matrix.artifact }}
          else
            tar -czvf ${{ matrix.artifact }}.tar.gz ${{ matrix.artifact }}
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            dist/${{ matrix.artifact }}.tar.gz
            dist/${{ matrix.artifact }}.zip
          if-no-files-found: ignore

  # ===========================================================================
  # Build Node.js prebuilt binaries
  # ===========================================================================
  build-nodejs:
    name: Build Node.js (${{ matrix.os }})
    needs: check-release
    if: needs.check-release.outputs.should-release == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-linux
          - os: macos-13
            target: x86_64-macos
          - os: macos-latest
            target: aarch64-macos
          - os: windows-latest
            target: x86_64-windows
    steps:
      - uses: actions/checkout@v4

      - uses: jdx/mise-action@v2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      - name: Build Zig library
        run: zig build -Doptimize=ReleaseFast

      - name: Install dependencies
        working-directory: bindings/nodejs
        run: npm install

      - name: Build prebuilt binary
        working-directory: bindings/nodejs
        run: npx prebuildify --napi --strip

      - name: Upload prebuilt
        uses: actions/upload-artifact@v4
        with:
          name: nodejs-prebuilt-${{ matrix.target }}
          path: bindings/nodejs/prebuilds/

  # ===========================================================================
  # Build Python wheels
  # ===========================================================================
  build-python:
    name: Build Python (${{ matrix.os }})
    needs: check-release
    if: needs.check-release.outputs.should-release == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-linux
          - os: macos-13
            target: x86_64-macos
          - os: macos-latest
            target: aarch64-macos
          - os: windows-latest
            target: x86_64-windows
    steps:
      - uses: actions/checkout@v4

      - uses: jdx/mise-action@v2

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build Zig library
        run: zig build -Doptimize=ReleaseFast

      - name: Install build tools
        run: pip install build wheel

      - name: Copy library to package
        working-directory: bindings/python
        shell: bash
        run: |
          mkdir -p liquidz/lib
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            cp ../../zig-out/lib/liquidz_ffi.dll liquidz/lib/ 2>/dev/null || true
          elif [[ "${{ runner.os }}" == "macOS" ]]; then
            cp ../../zig-out/lib/libliquidz_ffi.dylib liquidz/lib/
          else
            cp ../../zig-out/lib/libliquidz_ffi.so liquidz/lib/
          fi

      - name: Build wheel
        working-directory: bindings/python
        run: python -m build --wheel

      - name: Upload wheel
        uses: actions/upload-artifact@v4
        with:
          name: python-wheel-${{ matrix.target }}
          path: bindings/python/dist/*.whl

  # ===========================================================================
  # Build Ruby native gems
  # ===========================================================================
  build-ruby:
    name: Build Ruby (${{ matrix.os }})
    needs: check-release
    if: needs.check-release.outputs.should-release == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-linux
            platform: x86_64-linux
          - os: macos-13
            target: x86_64-macos
            platform: x86_64-darwin
          - os: macos-latest
            target: aarch64-macos
            platform: arm64-darwin
    steps:
      - uses: actions/checkout@v4

      - uses: jdx/mise-action@v2

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"

      - name: Build Zig library
        run: zig build -Doptimize=ReleaseFast

      - name: Install dependencies
        working-directory: bindings/ruby
        run: |
          gem install bundler rake-compiler
          bundle install

      - name: Compile extension
        working-directory: bindings/ruby
        run: bundle exec rake compile

      - name: Build gem
        working-directory: bindings/ruby
        run: gem build liquidz.gemspec

      - name: Upload gem
        uses: actions/upload-artifact@v4
        with:
          name: ruby-gem-${{ matrix.target }}
          path: bindings/ruby/*.gem

  # ===========================================================================
  # Build Elixir precompiled NIFs
  # ===========================================================================
  build-elixir:
    name: Build Elixir (${{ matrix.os }})
    needs: check-release
    if: needs.check-release.outputs.should-release == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-linux
            nif_target: x86_64-linux-gnu
          - os: macos-13
            target: x86_64-macos
            nif_target: x86_64-apple-darwin
          - os: macos-latest
            target: aarch64-macos
            nif_target: aarch64-apple-darwin
    steps:
      - uses: actions/checkout@v4

      - uses: jdx/mise-action@v2

      - name: Setup Elixir
        uses: erlef/setup-beam@v1
        with:
          otp-version: "26"
          elixir-version: "1.16"

      - name: Build Zig library
        run: zig build -Doptimize=ReleaseFast

      - name: Install dependencies
        working-directory: bindings/elixir
        run: |
          mix local.hex --force
          mix local.rebar --force
          mix deps.get

      - name: Compile NIF
        working-directory: bindings/elixir
        run: mix compile

      - name: Package precompiled NIF
        working-directory: bindings/elixir
        run: |
          mkdir -p priv/native
          cp priv/liquidz_nif.so priv/native/libliquidz_nif-${{ matrix.nif_target }}.so 2>/dev/null || true

      - name: Upload precompiled NIF
        uses: actions/upload-artifact@v4
        with:
          name: elixir-nif-${{ matrix.target }}
          path: bindings/elixir/priv/

  # ===========================================================================
  # Build WebAssembly package
  # ===========================================================================
  build-wasm:
    name: Build WebAssembly
    needs: check-release
    if: needs.check-release.outputs.should-release == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: jdx/mise-action@v2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      - name: Build WASM
        run: zig build -Doptimize=ReleaseFast -Dtarget=wasm32-freestanding

      - name: Package WASM for npm
        run: |
          mkdir -p dist/liquidz-wasm
          cp zig-out/lib/libliquidz_wasm.a dist/liquidz-wasm/ 2>/dev/null || true
          # Create package.json for WASM package
          cat > dist/liquidz-wasm/package.json << 'PKGJSON'
          {
            "name": "@liquidz/wasm",
            "version": "${{ needs.check-release.outputs.next-version }}",
            "description": "Liquidz Liquid template engine - WebAssembly build",
            "main": "index.js",
            "types": "index.d.ts",
            "keywords": ["liquid", "template", "wasm", "webassembly"],
            "author": "Pedro Pinera Buendia",
            "license": "MIT",
            "repository": {
              "type": "git",
              "url": "https://github.com/pepicrft/liquidz.git"
            }
          }
          PKGJSON

      - name: Upload WASM artifact
        uses: actions/upload-artifact@v4
        with:
          name: liquidz-wasm
          path: dist/liquidz-wasm/

  # ===========================================================================
  # Publish all packages atomically
  # ===========================================================================
  publish:
    name: Publish packages
    needs:
      - check-release
      - build-executables
      - build-libraries
      - build-nodejs
      - build-python
      - build-ruby
      - build-elixir
      - build-wasm
    if: needs.check-release.outputs.should-release == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: jdx/mise-action@v2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"

      - name: Setup Elixir
        uses: erlef/setup-beam@v1
        with:
          otp-version: "26"
          elixir-version: "1.16"

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Prepare release assets
        run: |
          mkdir -p release
          find artifacts -type f \( -name "*.tar.gz" -o -name "*.zip" \) -exec cp {} release/ \;
          cd release
          sha256sum * > sha256.txt 2>/dev/null || true
          sha512sum * > sha512.txt 2>/dev/null || true

      # -------------------------------------------------------------------------
      # Prepare Node.js package with prebuilds
      # -------------------------------------------------------------------------
      - name: Prepare Node.js package
        run: |
          cd bindings/nodejs
          # Update version
          npm version ${{ needs.check-release.outputs.next-version }} --no-git-tag-version --allow-same-version
          # Copy prebuilds from all platforms
          mkdir -p prebuilds
          cp -r ../../artifacts/nodejs-prebuilt-*/prebuilds/* prebuilds/ 2>/dev/null || true
          # Install prebuildify-ci for runtime detection
          npm install --save node-gyp-build

      - name: Update Node.js index.js for prebuilds
        run: |
          cat > bindings/nodejs/index.js << 'INDEXJS'
          let native;
          try {
            native = require('node-gyp-build')(__dirname);
          } catch (e) {
            native = require('./build/Release/liquidz.node');
          }

          function render(template, data = {}) {
            if (typeof template !== 'string') {
              throw new TypeError('Template must be a string');
            }
            return native.render(template, data);
          }

          function renderString(template, data = {}) {
            return render(template, data);
          }

          module.exports = { render, renderString };
          INDEXJS

      # -------------------------------------------------------------------------
      # Prepare Python package with bundled library
      # -------------------------------------------------------------------------
      - name: Prepare Python package
        run: |
          cd bindings/python
          # Update version in pyproject.toml
          sed -i 's/version = ".*"/version = "${{ needs.check-release.outputs.next-version }}"/' pyproject.toml
          # Collect all wheels
          mkdir -p dist
          cp ../../artifacts/python-wheel-*/*.whl dist/ 2>/dev/null || true

      # -------------------------------------------------------------------------
      # Prepare Ruby gems
      # -------------------------------------------------------------------------
      - name: Prepare Ruby gems
        run: |
          cd bindings/ruby
          # Update version in gemspec
          sed -i 's/spec.version.*=.*/spec.version       = "${{ needs.check-release.outputs.next-version }}"/' liquidz.gemspec
          # Collect all gems
          mkdir -p pkg
          cp ../../artifacts/ruby-gem-*/*.gem pkg/ 2>/dev/null || true

      # -------------------------------------------------------------------------
      # Prepare Elixir package
      # -------------------------------------------------------------------------
      - name: Prepare Elixir package
        run: |
          cd bindings/elixir
          # Update version in mix.exs
          sed -i 's/@version ".*"/@version "${{ needs.check-release.outputs.next-version }}"/' mix.exs
          # Copy precompiled NIFs
          mkdir -p priv/native
          cp ../../artifacts/elixir-nif-*/native/* priv/native/ 2>/dev/null || true
          cp ../../artifacts/elixir-nif-*/*.so priv/ 2>/dev/null || true

      # -------------------------------------------------------------------------
      # Publish to npm
      # -------------------------------------------------------------------------
      - name: Publish to npm
        working-directory: bindings/nodejs
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          npm publish --access public || echo "npm publish failed or package already exists"

      # -------------------------------------------------------------------------
      # Publish to PyPI
      # -------------------------------------------------------------------------
      - name: Publish to PyPI
        working-directory: bindings/python
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_TOKEN }}
        run: |
          pip install twine
          twine upload dist/*.whl --skip-existing || echo "PyPI publish failed or package already exists"

      # -------------------------------------------------------------------------
      # Publish to RubyGems
      # -------------------------------------------------------------------------
      - name: Publish to RubyGems
        working-directory: bindings/ruby
        env:
          GEM_HOST_API_KEY: ${{ secrets.RUBYGEMS_API_KEY }}
        run: |
          mkdir -p ~/.gem
          echo "---" > ~/.gem/credentials
          echo ":rubygems_api_key: $GEM_HOST_API_KEY" >> ~/.gem/credentials
          chmod 0600 ~/.gem/credentials
          for gem in pkg/*.gem; do
            gem push "$gem" || echo "RubyGems publish failed for $gem"
          done

      # -------------------------------------------------------------------------
      # Publish to Hex.pm
      # -------------------------------------------------------------------------
      - name: Publish to Hex.pm
        working-directory: bindings/elixir
        env:
          HEX_API_KEY: ${{ secrets.HEX_API_KEY }}
        run: |
          mix local.hex --force
          mix deps.get
          mix hex.publish --yes || echo "Hex publish failed or package already exists"

      # -------------------------------------------------------------------------
      # Update CHANGELOG and create GitHub release
      # -------------------------------------------------------------------------
      - name: Update CHANGELOG.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: git cliff --bump -o CHANGELOG.md

      - name: Commit changes
        id: auto-commit
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_options: "--allow-empty"
          tagging_message: ${{ needs.check-release.outputs.next-version }}
          skip_dirty_check: true
          file_pattern: "CHANGELOG.md bindings/*/package.json bindings/*/pyproject.toml bindings/*/mix.exs bindings/*/*.gemspec"
          commit_message: "[Release] liquidz ${{ needs.check-release.outputs.next-version }}"

      - name: Get release notes
        id: release-notes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "RELEASE_NOTES<<EOF" >> "$GITHUB_OUTPUT"
          git cliff --latest >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          draft: false
          name: ${{ needs.check-release.outputs.next-version }}
          tag_name: ${{ needs.check-release.outputs.next-version }}
          body: ${{ steps.release-notes.outputs.RELEASE_NOTES }}
          target_commitish: ${{ steps.auto-commit.outputs.commit_hash }}
          files: |
            release/*
